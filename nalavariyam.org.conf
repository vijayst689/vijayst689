<VirtualHost 167.71.231.146:80>
        ServerName nalavariyam.org
        ServerAlias www.nalavariyam.org
        DocumentRoot /var/www/html/nalavariyam.org/public
	       <Directory "/var/www/html/nalavariyam.org/public">
        	Options Indexes FollowSymLinks MultiViews
	        AllowOverride All
        	Order allow,deny
	        allow from all
	        </Directory>
RewriteEngine on
RewriteCond %{SERVER_NAME} =nalavariyam.org [OR]
RewriteCond %{SERVER_NAME} =www.nalavariyam.org
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
